<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a6b;--red:#c8102e;--green:#4caf50;--bg:#f6f8fc;--card:#fff;--tx:#1d2433;--mu:#5b6478;--bd:#e3e8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#171e36;--tx:#e8ecf8;--mu:#a3adc7;--bd:#28314f;--navy:#8fa2ff}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;color:var(--navy);font-size:15px;line-height:1.3}
.brand img{width:44px;height:44px;border-radius:50%}
nav{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--mu)}
nav a:hover{background:var(--bg);color:var(--navy)}
#lang,#menu{border:1px solid var(--bd);background:var(--card);color:var(--navy);border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
#menu{display:none}
@media(max-width:860px){#menu{display:block;margin-inline-start:auto}nav{display:none;position:absolute;top:100%;inset-inline:0;background:var(--card);flex-direction:column;align-items:stretch;padding:10px 16px;border-bottom:1px solid var(--bd)}nav.open{display:flex}nav a{padding:10px}}
section{padding:56px 20px;max-width:1000px;margin:auto}
h1{font-size:clamp(26px,5vw,42px);line-height:1.4;color:var(--navy);margin:0 0 12px}
h2{font-size:26px;color:var(--navy);margin:0 0 6px}
h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--green));margin:8px 0 20px}
.hero{text-align:center;padding-top:44px}
.hero img{width:130px;height:130px;border-radius:50%;box-shadow:0 8px 28px rgba(27,42,107,.2)}
.hero p{max-width:640px;margin:0 auto 22px;color:var(--mu);font-size:17px}
.slogan{color:var(--green);font-weight:700;margin-bottom:8px}
.btn{display:inline-block;padding:11px 24px;border-radius:30px;font:inherit;font-weight:600;text-decoration:none;border:2px solid var(--navy);cursor:pointer;margin:4px}
.p{background:var(--navy);color:#fff}.s{background:transparent;color:var(--navy)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .p{color:#0f1426}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.card .ic{font-size:26px}.card b{color:var(--navy)}
.alt{background:var(--card);max-width:none}.alt>div{max-width:1000px;margin:auto}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;padding:2px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--navy)}
details p{margin:0 0 14px;color:var(--mu)}
.grid{align-items:start}summary{list-style:none;display:flex;align-items:center;gap:10px}summary::-webkit-details-marker{display:none}summary>span:not(.ic):not(.num){flex:1}
summary::after{content:"";margin-inline-start:auto;width:9px;height:9px;border:solid var(--red);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .25s;flex:none}
details[open] summary::after{transform:rotate(-135deg)}details[open]{border-color:var(--green);box-shadow:0 4px 16px rgba(27,42,107,.08)}details:not(:has(p)) summary::after{display:none}
summary .ic{font-size:22px}
.num{display:inline-block;min-width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;text-align:center;line-height:28px;font-size:13px;margin-inline-end:8px}
.note{border-inline-start:4px solid var(--red);background:var(--bg);padding:10px 14px;border-radius:8px;color:var(--mu);font-size:14px;margin-top:16px}
h3{color:var(--navy);margin:22px 0 10px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:10px}
.src a{color:var(--green);margin-inline-end:14px}
footer{background:var(--navy);color:#dfe5ff;padding:32px 20px;text-align:center;font-size:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) footer{background:#0a0f20}}
footer a{margin:0 8px;color:#fff}footer img{width:56px;height:56px;border-radius:50%}
</style>
</head>

var T={
ar:{name:"الحياة للطب النفسي وعلاج الإدمان",slogan:"معًا.. لحياة أفضل",h1:"الحياة.. بداية جديدة نحو صحة نفسية أفضل",
hp:"الصحة النفسية جزء أساسي من صحتنا، وطلب المساعدة خطوة مهمة نحو حياة أكثر استقرارًا وتوازنًا. نحن هنا لنقدم لك المعلومات والدعم اللازمين.",
b1:"تواصل مع المركز",b2:"تعرف على حقوقك",aboutH:"من نحن؟",
aboutP:"الحياة للطب النفسي وعلاج الإدمان، مركز متخصص في مجال الصحة النفسية وعلاج اضطرابات تعاطي المواد، ويهدف إلى تقديم رعاية قائمة على الاحترام والخصوصية والاهتمام بالإنسان.",
svH:"الخدمات الطبية",svN:"هذه تصنيفات مقترحة، ويجب اعتماد الخدمات الفعلية من إدارة المركز قبل نشرها.",
sv:[["🩺","التقييم النفسي"],["💬","الاستشارات النفسية"],["📋","متابعة الحالات النفسية"],["🌱","علاج اضطرابات تعاطي المواد"],["🤝","الدعم النفسي والاجتماعي"],["🔁","برامج المتابعة والتأهيل بعد العلاج"]],
rH:"حقوقك كمريض نفسي",aH:"حقوق المريض في حالات العلاج الإداري",
rN:"تنبيه: هذا المحتوى ملخص توعوي، ويجب مراجعته قانونيًا ومطابقته مع القانون المصري رقم 71 لسنة 2009 وتعديلاته ولائحته التنفيذية قبل اعتماده كنص رسمي.",
r:["الحق في تلقي العناية الواجبة في بيئة آمنة ونظيفة.","الحق في معرفة حقوق المريض وفقًا للقانون.","الإحاطة علمًا بأسماء ووظائف أفراد الفريق العلاجي.","الحق في رفض مناظرته أو علاجه بواسطة أحد أفراد الفريق العلاجي وفق الضوابط القانونية.","تلقي المعلومات الكاملة عن التشخيص والخطة العلاجية واحتمالات تطور الحالة.","أن يكون العلاج المقدم طبقًا للمعايير الطبية العلمية المعترف بها.","عدم إخضاع المريض للبحوث الإكلينيكية إلا وفق الضوابط القانونية والأخلاقية.","الحصول على شرح واضح لهدف البحث وإجراءاته قبل المشاركة.","حماية سرية المعلومات المتعلقة بالمريض وملفه الطبي.","حماية الخصوصية والمعتقدات الشخصية ومكان الإقامة داخل المنشأة.","الحصول على تقرير طبي عن الحالة والفحوصات والإجراءات العلاجية.","الحق في التظلم وفق الإجراءات القانونية.","مقابلة المحامي وفق الضوابط المنظمة.","الحصول على خطة رعاية نفسية بعد الخروج.","الحماية من الاستغلال والإيذاء الجسدي والنفسي والمعاملة السيئة.","الحصول على خدمات الاتصال وفق الضوابط والخطة العلاجية."],
a:["الحصول على المعلومات اللازمة عن العلاج المقترح.","معرفة القرارات المتعلقة بالعلاج والخروج.","الحصول على شرح للآثار المترتبة على رفض العلاج.","الحصول على خطة العلاج والخروج وفقًا للقواعد القانونية."],
lH:"اعرف أكثر عن صحتك النفسية",fH:"معلومات علمية سريعة",srcT:"المصادر:",
l:[["الصحة النفسية",["ما الصحة النفسية؟","أهمية الاهتمام بالصحة النفسية","متى نحتاج إلى استشارة طبيب نفسي؟","الفرق بين الحزن والاكتئاب","اضطرابات القلق","اضطرابات النوم والصحة النفسية"]],["الإدمان والتعافي",["ما اضطراب تعاطي المواد؟","تأثير الإدمان على الدماغ والسلوك","هل يمكن التعافي من اضطرابات تعاطي المواد؟","أهمية الدعم النفسي والاجتماعي","دور الأسرة في رحلة التعافي","أهمية المتابعة بعد العلاج"]]],
f:["الصحة النفسية جزء لا يتجزأ من الصحة العامة.","الاضطرابات النفسية حالات صحية حقيقية وليست ضعفًا في الشخصية.","تتوفر علاجات نفسية ودوائية فعالة للعديد من الاضطرابات.","التعافي من اضطرابات تعاطي المواد ممكن، وتختلف رحلة العلاج من شخص لآخر.","الدعم الأسري والاجتماعي قد يساعد في رحلة التعافي."],

q:[["ما الفرق بين الطبيب النفسي والأخصائي النفسي؟","الطبيب النفسي طبيب بشري متخصص يمكنه التشخيص ووصف الأدوية، أما الأخصائي النفسي فيقدّم التقييم والعلاج النفسي والدعم دون وصف أدوية."],["متى يجب طلب المساعدة النفسية؟","عندما تؤثر المشاعر أو السلوكيات على النوم أو العمل أو العلاقات أو الحياة اليومية، أو عند وجود قلق مستمر بشأنها."],["هل يمكن علاج الاكتئاب؟","نعم، تتوفر علاجات نفسية ودوائية فعالة، وتختلف الخطة حسب كل حالة بتقييم الطبيب."],["هل اضطرابات القلق قابلة للعلاج؟","نعم، يمكن السيطرة عليها بالعلاج النفسي و/أو الدوائي وفق تقييم المختص."],["هل يمكن التعافي من اضطرابات تعاطي المواد؟","التعافي ممكن، وتختلف رحلته من شخص لآخر، ويساعد عليه العلاج والدعم الأسري والاجتماعي."],["لماذا تعتبر المتابعة بعد العلاج مهمة؟","لأنها تدعم الاستقرار والتعافي وتساعد على التعامل مع التحديات بعد انتهاء العلاج."],["هل المعلومات الطبية سرية؟","نعم، سرية المعلومات المتعلقة بالمريض وملفه الطبي حق أساسي من حقوقه."],["كيف يمكن التواصل مع المركز؟","عبر الاتصال على 01010873420 أو واتساب أو نموذج التواصل في هذه الصفحة."],["ما الخدمات التي يقدمها المركز؟","تشمل الخدمات المقترحة التقييم والاستشارات والمتابعة وعلاج تعاطي المواد والدعم والتأهيل، وتُعتمد الخدمات الفعلية من إدارة المركز."]],

r:["The right to proper care in a safe and clean environment.","The right to know patient rights under the law.","To be informed of the names and roles of treatment team members.","The right to refuse examination or treatment by a team member, within legal rules.","To receive full information on the diagnosis, treatment plan and likely course of the condition.","That treatment follows recognized scientific medical standards.","Not to be subjected to clinical research except under legal and ethical rules.","To receive a clear explanation of a study's purpose and procedures before participating.","Protection of the confidentiality of patient information and medical file.","Protection of privacy, personal beliefs and place of stay within the facility.","To obtain a medical report on the condition, tests and treatment procedures.","The right to file a grievance through legal procedures.","To meet a lawyer under the regulating rules.","To receive a psychological care plan after discharge.","Protection from exploitation, physical and psychological abuse and mistreatment.","To access communication services according to the rules and treatment plan."],

q:[["What is the difference between a psychiatrist and a psychologist?","A psychiatrist is a medical doctor who can diagnose and prescribe medication; a psychologist provides assessment, therapy and support without prescribing medication."],["When should I seek psychological help?","When feelings or behaviors affect sleep, work, relationships or daily life, or when you are persistently worried about them."],["Can depression be treated?","Yes. Effective psychological and medication treatments exist; the plan depends on each case after a doctor's assessment."],["Are anxiety disorders treatable?","Yes. They can be managed with therapy and/or medication according to a specialist's assessment."],["Is recovery from substance use disorders possible?","Yes. Recovery is possible and varies by person; treatment and family and social support help."],["Why is follow-up after treatment important?","It supports stability and recovery and helps in handling challenges after treatment ends."],["Is medical information confidential?","Yes. Confidentiality of patient information and medical file is a basic patient right."],["How can I contact the center?","Call 01010873420, use WhatsApp, or the contact form on this page."],["What services does the center offer?","Proposed services include assessment, counseling, follow-up, substance use treatment, support and rehabilitation; actual services are confirmed by center management."]],

T.ar.sv=[["🩺","التقييم النفسي","جلسة يجريها المختص لفهم الشكوى والأعراض وبدايتها وتأثيرها على الحياة اليومية، وقد تشمل مقابلة إكلينيكية واستبيانات معتمدة. يساعد التقييم على تحديد التشخيص المحتمل والخطة المناسبة، ويقرره الطبيب أو الأخصائي المعالج فقط."],["💬","الاستشارات النفسية","مساحة سرية للحديث مع مختص حول الضغوط والقلق والحزن ومشكلات العلاقات والتأقلم مع تغيّرات الحياة. تهدف إلى فهم المشكلة وتنمية مهارات التعامل معها، وقد تُحال الحالة إلى الطبيب النفسي إذا لزم الأمر."],["📋","متابعة الحالات النفسية","زيارات دورية لتقييم الاستجابة للعلاج ومتابعة الأعراض والآثار الجانبية وتعديل الخطة عند الحاجة. من المهم الالتزام بالمواعيد وعدم تغيير الدواء أو إيقافه دون استشارة الطبيب."],["🌱","علاج اضطرابات تعاطي المواد","يبدأ بتقييم شامل لحالة كل شخص، وقد يتضمن علاجًا نفسيًا وسلوكيًا، ودعمًا طبيًا لإدارة أعراض الانسحاب عند الحاجة، وعلاج أي اضطراب نفسي مصاحب. تختلف الخطة ومدتها من شخص لآخر، ولا يمكن ضمان نتيجة محددة."],["🤝","الدعم النفسي والاجتماعي","دعم يشمل المريض وأسرته عبر التثقيف النفسي والإرشاد الأسري وتعزيز مهارات التواصل والتعامل مع الضغوط، لأن دعم الأسرة والمحيط الاجتماعي قد يساعد في رحلة التعافي."],["🔁","برامج المتابعة والتأهيل بعد العلاج","مرحلة تلي العلاج الأساسي تركز على الحفاظ على التحسن وتعلم مهارات الوقاية من الانتكاس والعودة التدريجية للعمل والدراسة والحياة الاجتماعية، مع متابعة دورية."]];
T.en.sv=[["🩺","Psychological assessment","A session in which a specialist explores your concerns, symptoms, when they began and how they affect daily life. It may include a clinical interview and validated questionnaires. It helps identify a possible diagnosis and suitable plan, which only the treating doctor or specialist can determine."],["💬","Psychological counseling","A confidential space to talk with a specialist about stress, anxiety, sadness, relationship problems and adjusting to life changes. It aims to understand the problem and build coping skills, and may involve referral to a psychiatrist when needed."],["📋","Ongoing follow-up","Regular visits to review response to treatment, monitor symptoms and side effects, and adjust the plan as needed. It is important to attend appointments and never change or stop medication without consulting your doctor."],["🌱","Treatment of substance use disorders","Starts with a comprehensive assessment of each person. It may include psychological and behavioral therapy, medical support to manage withdrawal when needed, and treatment of any co-occurring mental disorder. Plans and duration vary, and no specific outcome can be guaranteed."],["🤝","Psychological and social support","Support for the patient and family through psychoeducation, family counseling, and building communication and stress-coping skills, since family and social support can help in recovery."],["🔁","Aftercare and rehabilitation","A stage after primary treatment focused on maintaining progress, learning relapse-prevention skills and gradually returning to work, study and social life, with regular follow-up."]];
T.ar.l=[["الصحة النفسية",[["ما الصحة النفسية؟","تعرّفها منظمة الصحة العالمية بأنها حالة من العافية يستطيع فيها الفرد إدراك قدراته والتعامل مع ضغوط الحياة العادية والعمل بإنتاجية والمساهمة في مجتمعه. وهي ليست مجرد غياب المرض النفسي."],["أهمية الاهتمام بالصحة النفسية","الصحة النفسية جزء لا يتجزأ من الصحة العامة، وتؤثر في التفكير والمشاعر والسلوك والعلاقات والصحة الجسدية. والاهتمام بها مبكرًا يساعد على التعامل مع الضغوط."],["متى نحتاج إلى استشارة طبيب نفسي؟","يُنصح بالتقييم المتخصص عند استمرار الأعراض لأسابيع، أو تأثيرها على النوم أو العمل أو الدراسة أو العلاقات، أو فقدان الاهتمام بالأنشطة المعتادة. وعند وجود أفكار لإيذاء النفس يجب طلب مساعدة عاجلة فورًا."],["الفرق بين الحزن والاكتئاب","الحزن شعور طبيعي مرتبط عادةً بموقف ويتحسن غالبًا مع الوقت. أما الاكتئاب فاضطراب يتميز باستمرار الحزن أو فقدان الاهتمام أسبوعين فأكثر مع أعراض أخرى كاضطراب النوم والشهية وضعف التركيز. والتشخيص يقرره المختص."],["اضطرابات القلق","القلق شعور طبيعي، لكنه يصبح اضطرابًا حين يكون مفرطًا ومستمرًا ويعيق الحياة اليومية. من أنواعه القلق العام ونوبات الهلع والقلق الاجتماعي والرهاب، وتتوفر علاجات نفسية ودوائية فعالة."],["اضطرابات النوم والصحة النفسية","العلاقة بين النوم والصحة النفسية متبادلة؛ فقلة النوم قد تزيد القلق والاكتئاب، كما تسبب الاضطرابات النفسية مشكلات في النوم. واستمرار الأرق لفترة طويلة يستدعي تقييمًا طبيًا."]]],["الإدمان والتعافي",[["ما اضطراب تعاطي المواد؟","حالة صحية مزمنة تتميز بالاستمرار في استخدام مادة رغم أضرارها، مع صعوبة التحكم في الاستخدام وظهور التحمل أو أعراض الانسحاب. هو اضطراب طبي وليس ضعفًا في الإرادة أو الأخلاق."],["تأثير الإدمان على الدماغ والسلوك","تؤثر المواد المؤثرة نفسيًا في دوائر المكافأة واتخاذ القرار والتحكم في الانفعالات بالدماغ، مما يجعل التوقف صعبًا ويفسر التغيرات السلوكية. وقد يتعافى الدماغ جزئيًا أو كليًا مع الوقت والعلاج."],["هل يمكن التعافي من اضطرابات تعاطي المواد؟","نعم، التعافي ممكن. ويُنظر للاضطراب كحالة مزمنة قد تحدث فيها انتكاسات، وهذا لا يعني فشل العلاج. تختلف الرحلة من شخص لآخر، ولا يمكن ضمان نتيجة محددة."],["أهمية الدعم النفسي والاجتماعي","يعزز الدعم النفسي والاجتماعي الالتزام بالعلاج، ويقلل العزلة، ويساعد على بناء مهارات الحياة والعلاقات الصحية، وهو مكمل للعلاج الطبي والنفسي."],["دور الأسرة في رحلة التعافي","يشمل دور الأسرة التفهم وتجنب الوصم، والمشاركة في جلسات الإرشاد الأسري عند الاقتضاء، ووضع حدود صحية، والاهتمام بصحتها النفسية هي أيضًا، وللأسرة حق في طلب الدعم."],["أهمية المتابعة بعد العلاج","التعافي مسار طويل، والمتابعة المنتظمة بعد العلاج تساعد على اكتشاف علامات الانتكاس مبكرًا وتعديل الخطة وتعزيز الاستقرار."]]]];
T.en.l=[["Mental health",[["What is mental health?","The WHO describes it as a state of well-being in which a person realizes their abilities, copes with normal life stresses, works productively and contributes to their community. It is more than the absence of mental illness."],["Why mental health matters","Mental health is an integral part of overall health and affects thinking, feelings, behavior, relationships and physical health. Paying attention early helps in coping with stress."],["When to consult a psychiatrist","Specialist assessment is advised when symptoms last for weeks, affect sleep, work, study or relationships, or when interest in usual activities is lost. If there are thoughts of self-harm, seek urgent help immediately."],["Sadness vs. depression","Sadness is a natural feeling, usually tied to an event, and often eases with time. Depression is a disorder marked by persistent low mood or loss of interest for two weeks or more, with other symptoms such as sleep or appetite changes and poor concentration. Diagnosis is made by a specialist."],["Anxiety disorders","Anxiety is natural, but becomes a disorder when excessive, persistent and disrupting daily life. Types include generalized anxiety, panic attacks, social anxiety and phobias. Effective psychological and medication treatments exist."],["Sleep disorders and mental health","Sleep and mental health affect each other: poor sleep can worsen anxiety and depression, and mental disorders can disturb sleep. Insomnia lasting a long time calls for medical evaluation."]]],["Addiction & recovery",[["What is a substance use disorder?","A chronic health condition marked by continued use of a substance despite harm, difficulty controlling use, and tolerance or withdrawal. It is a medical disorder, not a weakness of will or morals."],["Addiction's effect on the brain and behavior","Psychoactive substances affect the brain's reward, decision-making and impulse-control circuits, making it hard to stop and explaining behavior changes. The brain can recover partly or fully with time and treatment."],["Is recovery from substance use disorders possible?","Yes, recovery is possible. The disorder is seen as chronic, with possible relapses that do not mean treatment has failed. The journey differs for each person and no specific outcome can be guaranteed."],["The importance of psychological and social support","Support strengthens treatment adherence, reduces isolation and helps build life skills and healthy relationships. It complements medical and psychological treatment."],["The family's role in recovery","The family's role includes understanding, avoiding stigma, joining family counseling when appropriate, setting healthy boundaries and caring for their own mental health. Families may also seek support."],["The importance of follow-up after treatment","Recovery is a long path; regular follow-up helps detect early signs of relapse, adjust the plan and strengthen stability."]]]];
